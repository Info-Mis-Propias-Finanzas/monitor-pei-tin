# Actualiza data/precios.json con los cierres de PEI y TIN de la BVC y hace commit.
# Corre dos veces por día hábil, hora Colombia: 7:23 p. m., cuando la BVC ya cerró y publicó
# el cierre del día, y 6:23 a. m. del día siguiente como respaldo por si GitHub atrasó o se
# saltó la primera. Si el dato ya está, no cambia nada. El script revisa los últimos 10 días.
name: Actualizar precios PEI y TIN

on:
  schedule:
    - cron: '23 0 * * 2-6'    # lunes a viernes 7:23 p. m. Colombia (00:23 UTC)
    - cron: '23 11 * * 2-6'   # martes a sábado 6:23 a. m. Colombia, respaldo (11:23 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Traer cierres de la BVC
        run: python3 scripts/actualizar_precios.py
      - name: Guardar cambios
        run: |
          if git diff --quiet data/precios.json; then
            echo "Sin cierres nuevos"
          else
            git config user.name "actualizador-precios"
            git config user.email "actions@users.noreply.github.com"
            git add data/precios.json
            git commit -m "Precios BVC $(date -u +%F)"
            git pull --rebase
            git push
          fi
