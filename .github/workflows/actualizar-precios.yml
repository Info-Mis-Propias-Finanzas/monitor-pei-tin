# Actualiza data/precios.json con los cierres de PEI y TIN de la BVC y hace commit.
# Corre una vez por día hábil, a las 7:23 p. m. hora Colombia (00:23 UTC del día siguiente),
# cuando la BVC ya cerró y publicó el cierre del día. Si GitHub atrasa o se salta una corrida,
# la siguiente recupera los días que falten (el script revisa los últimos 10 días).
name: Actualizar precios PEI y TIN

on:
  schedule:
    - cron: '23 0 * * 2-6'   # martes a sábado 00:23 UTC = lunes a viernes 7:23 p. m. Colombia
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Traer cierres de la BVC
        run: python3 scripts/actualizar_precios.py
      - name: Guardar cambios
        run: |
          if git diff --quiet data/precios.json; then
            echo "Sin cierres nuevos"
          else
            git config user.name "actualizador-precios"
            git config user.email "actions@users.noreply.github.com"
            git add data/precios.json
            git commit -m "Precios BVC $(date -u +%F)"
            git pull --rebase
            git push
          fi
