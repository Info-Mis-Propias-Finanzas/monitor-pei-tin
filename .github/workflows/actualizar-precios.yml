# Actualiza data/precios.json con los cierres de PEI y TIN de la BVC y hace commit.
# Corre varias veces por día hábil (hora Colombia, UTC-5) porque GitHub puede atrasar
# las tareas programadas varias horas. Las corridas después de las 5 p. m. traen el cierre
# del mismo día; las demás son respaldo. Si no hay datos nuevos, no cambia nada.
name: Actualizar precios PEI y TIN

on:
  schedule:
    - cron: '17 11 * * 1-5'   # 6:17 a. m.
    - cron: '35 12 * * 1-5'   # 7:35 a. m.
    - cron: '5 18 * * 1-5'    # 1:05 p. m.
    - cron: '47 22 * * 1-5'   # 5:47 p. m. (cierre del día)
    - cron: '23 1 * * 2-6'    # 8:23 p. m. (respaldo del cierre)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Traer cierres de la BVC
        run: python3 scripts/actualizar_precios.py
      - name: Guardar cambios
        run: |
          if git diff --quiet data/precios.json; then
            echo "Sin cierres nuevos"
          else
            git config user.name "actualizador-precios"
            git config user.email "actions@users.noreply.github.com"
            git add data/precios.json
            git commit -m "Precios BVC $(date -u +%F)"
            git pull --rebase
            git push
          fi
